<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Число сознания и число миссии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px 12px; background: #f6f1e9; }

  /* ===== Всё, что ниже, изолировано внутри .nc-widget ===== */
  .nc-widget {
    --nc-bg: #fffaf2;
    --nc-ink: #2b2233;
    --nc-muted: #7a6f80;
    --nc-accent: #8a5a2b;
    --nc-accent-2: #b8864b;
    --nc-line: #eadfce;
    --nc-plus: #2f7a52;
    --nc-minus: #a8423a;
    box-sizing: border-box;
    max-width: 760px;
    margin: 0 auto;
    padding: 36px 28px 32px;
    background: var(--nc-bg);
    border: 1px solid var(--nc-line);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(60, 40, 20, .08);
    font-family: 'Manrope', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--nc-ink);
    line-height: 1.55;
  }
  .nc-widget *, .nc-widget *::before, .nc-widget *::after { box-sizing: border-box; }

  .nc-head { text-align: center; margin-bottom: 26px; }
  .nc-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700; font-size: 34px; line-height: 1.15;
    margin: 0 0 8px; color: var(--nc-ink);
  }
  .nc-sub { margin: 0; color: var(--nc-muted); font-size: 15px; }

  .nc-form {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin: 0 auto 6px; max-width: 460px;
  }
  .nc-input {
    flex: 1 1 220px;
    font: 600 20px/1 'Manrope', sans-serif; letter-spacing: .06em;
    text-align: center;
    padding: 15px 16px;
    border: 1.5px solid var(--nc-line); border-radius: 12px;
    background: #fff; color: var(--nc-ink);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .nc-input::placeholder { color: #c4b8c9; font-weight: 500; }
  .nc-input:focus { border-color: var(--nc-accent-2); box-shadow: 0 0 0 4px rgba(184,134,75,.15); }
  .nc-btn {
    flex: 0 0 auto;
    font: 600 16px/1 'Manrope', sans-serif;
    padding: 15px 26px; border: 0; border-radius: 12px; cursor: pointer;
    color: #fff; background: linear-gradient(135deg, var(--nc-accent), var(--nc-accent-2));
    transition: transform .15s, box-shadow .2s;
  }
  .nc-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(138,90,43,.3); }
  .nc-error { min-height: 22px; text-align: center; color: var(--nc-minus); font-size: 14px; margin: 4px 0 0; }

  .nc-results { display: none; margin-top: 18px; }
  .nc-results.is-visible { display: grid; gap: 18px; animation: nc-fade .45s ease; }
  @keyframes nc-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .nc-card {
    background: #fff; border: 1px solid var(--nc-line); border-radius: 16px;
    padding: 24px 24px 22px;
  }
  .nc-card-head { display: grid; grid-template-columns: 92px 1fr; gap: 18px; align-items: center; }
  .nc-summary {
    margin: 16px 0 4px; padding: 14px 16px; border-radius: 12px;
    background: #fcf7ef; border-left: 3px solid var(--nc-accent-2);
  }
  .nc-sections { margin-top: 6px; }
  .nc-sec { padding: 14px 0 0; border-top: 1px dashed var(--nc-line); margin-top: 14px; }
  .nc-sec:first-child { border-top: 0; margin-top: 8px; }
  .nc-sec-title {
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700;
    font-size: 20px; line-height: 1.25; margin: 0 0 4px; color: var(--nc-accent);
  }
  .nc-sec p { margin: 0; font-size: 15.5px; }
  .nc-num {
    width: 92px; height: 92px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1;
    color: var(--nc-accent);
    background: radial-gradient(circle at 30% 30%, #fff6e8, #f3e2c8);
    border: 1.5px solid #e6cfa9;
  }
  .nc-label {
    text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 600;
    color: var(--nc-accent-2); margin: 2px 0 2px;
  }
  .nc-name {
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.2;
    margin: 0 0 6px;
  }
  .nc-calc {
    display: inline-block; font-size: 13px; color: var(--nc-muted);
    background: #faf5ee; border-radius: 8px; padding: 4px 10px; margin-bottom: 0;
  }
  .nc-text { margin: 0 0 8px; font-size: 15.5px; }
  .nc-text:last-child { margin-bottom: 0; }
  .nc-tag { font-weight: 600; }
  .nc-tag--plus { color: var(--nc-plus); }
  .nc-tag--minus { color: var(--nc-minus); }
  .nc-days { font-size: 13px; color: var(--nc-muted); margin: 8px 0 0; }

  .nc-note { text-align: center; font-size: 12.5px; color: var(--nc-muted); margin: 22px 0 0; }

  @media (max-width: 520px) {
    .nc-widget { padding: 26px 16px 22px; border-radius: 16px; }
    .nc-title { font-size: 28px; }
    .nc-card { padding: 20px 16px; }
    .nc-card-head { grid-template-columns: 1fr; text-align: center; }
    .nc-num { margin: 0 auto; width: 80px; height: 80px; font-size: 48px; }
    .nc-btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<div class="nc-widget" id="nc-widget">
  <div class="nc-head">
    <h2 class="nc-title">Число сознания и число миссии</h2>
    <p class="nc-sub">Введите дату рождения, и расчёт появится сразу</p>
  </div>

  <form class="nc-form" id="nc-form" novalidate>
    <input class="nc-input" id="nc-date" type="text" inputmode="numeric" autocomplete="bday"
           placeholder="ДД.ММ.ГГГГ" maxlength="10" aria-label="Дата рождения">
    <button class="nc-btn" id="nc-btn" type="button">Рассчитать</button>
  </form>
  <p class="nc-error" id="nc-error" role="alert"></p>

  <div class="nc-results" id="nc-results" aria-live="polite">
    <div class="nc-card">
      <div class="nc-card-head">
        <div class="nc-num" id="nc-c-num">–</div>
        <div>
          <div class="nc-label">Число сознания</div>
          <h3 class="nc-name" id="nc-c-name"></h3>
          <span class="nc-calc" id="nc-c-calc"></span>
          <p class="nc-days" id="nc-c-days"></p>
        </div>
      </div>
      <div class="nc-summary">
        <p class="nc-text"><span class="nc-tag nc-tag--plus">В плюсе:</span> <span id="nc-c-plus"></span></p>
        <p class="nc-text"><span class="nc-tag nc-tag--minus">В минусе:</span> <span id="nc-c-minus"></span></p>
      </div>
      <div class="nc-sections" id="nc-c-sections"></div>
    </div>

    <div class="nc-card">
      <div class="nc-card-head">
        <div class="nc-num" id="nc-m-num">–</div>
        <div>
          <div class="nc-label">Число миссии</div>
          <h3 class="nc-name" id="nc-m-name"></h3>
          <span class="nc-calc" id="nc-m-calc"></span>
        </div>
      </div>
      <div class="nc-summary"><p class="nc-text" id="nc-m-text"></p></div>
      <div class="nc-sections" id="nc-m-sections"></div>
    </div>
  </div>

  <p class="nc-note">Число сознания считается по дню рождения, число миссии — по всем цифрам даты.</p>
</div>

<script>
(function () {
  var CONSCIOUSNESS = {
    1: { name: 'Энергия Солнца', days: '1, 10, 19, 28',
         plus: 'лидеры, самостоятельные, авторитетные.',
         minus: 'эгоизм, деспотизм, склонность к конфликтам.',
         sections: [
           ['Характер', 'Единица в сознании даёт сильное «я». Такой человек с детства хочет решать сам и плохо переносит, когда им командуют. Он сам ставит себе цели, держит слово и ждёт того же от других. Ему важно, чтобы его заметили и оценили, поэтому похвала для него лучшая мотивация.'],
           ['Сильные стороны', 'Умеет быстро принять решение и взять ответственность за результат. Щедрый и прямой, вдохновляет команду своим примером. В трудной ситуации не теряется и берёт управление на себя. Люди рядом с ним чувствуют уверенность.'],
           ['Слабые стороны', 'Болезненно реагирует на критику и с трудом признаёт ошибки. Может давить на близких и решать за них. Когда признания нет, появляется обида и желание доказать свою правоту любой ценой.'],
           ['В отношениях', 'В паре хочет быть главным и ждёт уважения. Хорошо подходит партнёр, который поддерживает и не соревнуется. Единице стоит учиться слушать и спрашивать мнение близких, прежде чем решать за всех.'],
           ['В работе', 'Руководитель, предприниматель, политик, государственная служба, управление проектами. Плохо чувствует себя там, где у него нет права голоса.'],
           ['Над чем работать', 'Учиться делегировать, признавать заслуги других и принимать помощь. В ведической традиции Солнце связывают с отцом, поэтому отношения с ним и с любыми фигурами власти многое говорят о том, как раскрывается единица.']
         ] },
    2: { name: 'Энергия Луны', days: '2, 11, 20, 29',
         plus: 'дипломаты, миротворцы, гибкие.',
         minus: 'сомнения, депрессивность, поиск опоры в других.',
         sections: [
           ['Характер', 'Двойка живёт чувствами. Она тонко считывает настроение людей и атмосферу в комнате, понимает то, что не сказано вслух. Настроение меняется, как фазы Луны: за один день может быть и подъём, и упадок. Ей важно чувствовать себя нужной и защищённой.'],
           ['Сильные стороны', 'Умеет сглаживать конфликты и находить подход к очень разным людям. Заботливая и внимательная, с развитой интуицией и воображением. Хороший партнёр и надёжный помощник, с ней легко договориться.'],
           ['Слабые стороны', 'Трудно принимает решения в одиночку и долго переживает обиды. Может зависеть от чужого мнения, подстраиваться и терять себя. В плохом состоянии уходит в жалость к себе и ищет, на кого опереться.'],
           ['В отношениях', 'Семья и близкие для двойки на первом месте. Ей нужны эмоциональная близость, тёплые слова и стабильность. Холодный или резкий партнёр её ранит, а надёжный помогает раскрыться.'],
           ['В работе', 'Психология, педагогика, медицина и уход за людьми, HR, сервис и гостеприимство, творческие профессии. Хорошо работает в паре и в команде.'],
           ['Над чем работать', 'Учиться опираться на себя, замечать свои желания и говорить «нет». Помогают режим, вода, природа и всё, что успокаивает эмоции. Луну связывают с матерью, и отношения с ней сильно влияют на внутреннее состояние двойки.']

    3: { name: 'Энергия Юпитера', days: '3, 12, 21, 30',
         plus: 'наставники, аналитики, стремящиеся к знаниям и порядку («люди-инструкции»).',
         minus: 'поверхностность, категоричность, стремление всех поучать.',
         sections: [
           ['Характер', 'Тройка ищет в мире порядок и смысл. Ей нужно понимать, как всё устроено, и объяснять это другим. Такие люди любят учиться, читать, раскладывать по полочкам и давать советы. У них сильное чувство справедливости и свои принципы.'],
           ['Сильные стороны', 'Хорошо объясняет сложное простыми словами, умеет выстроить систему и написать понятную инструкцию. Ответственная и честная, к ней часто приходят за советом. Умеет учить и вдохновлять на рост.'],
           ['Слабые стороны', 'Может считать своё мнение единственно верным и раздавать советы, когда их не просили. Иногда знает тему по верхам, а уверенности в своей правоте уже много. В споре становится категоричной.'],
           ['В отношениях', 'Ценит уважение и общие ценности. Часто и в семье берёт роль наставника, что нравится не всем. Отношения крепнут, когда тройка не только учит, но и слушает.'],

         ] },
    4: { name: 'Энергия Раху', days: '4, 13, 22, 31',

         minus: 'упрямство, гиперконтроль, иллюзии.',
         sections: [
           ['Характер', 'Четвёрка смотрит на мир иначе, чем большинство. Ей скучно в привычных рамках, её тянет к новому, необычному, иногда запретному. Идеи приходят неожиданно, интуиция сильная. Внутри часто живёт чувство «мне мало», и оно толкает вперёд.'],
           ['Сильные стороны', 'Смело меняет устои и быстро осваивает технологии и новые направления. Видит возможности там, где другие видят риск. Умеет удивлять и вести за собой нестандартными решениями.'],
           ['Слабые стороны', 'Может бросаться из крайности в крайность и гнаться за тем, чего на самом деле нет. Склонна к тревоге и недовольству тем, что уже есть. Трудно доверяет и хочет всё держать под контролем.'],
           ['В отношениях', 'Нуждается в свободе и в партнёре, с которым интересно. Рутина и ограничения быстро её отталкивают. Ей важно учиться открыто говорить о чувствах и не проверять близких на прочность.'],

  var root = document.getElementById('nc-widget');
  var $ = function (id) { return root.querySelector('#' + id); };
  var input = $('nc-date'), form = $('nc-form'), err = $('nc-error'), results = $('nc-results');

  // Сводит число к одной цифре и возвращает цепочку расчёта
  function reduce(digits) {
    var steps = [];
    var sum = digits.reduce(function (a, b) { return a + b; }, 0);
    steps.push(digits.join(' + ') + ' = ' + sum);
    while (sum > 9) {
      var d = String(sum).split('').map(Number);
      sum = d.reduce(function (a, b) { return a + b; }, 0);
      steps.push(d.join(' + ') + ' = ' + sum);
    }
    return { value: sum, calc: digits.length === 1 && digits[0] <= 9 ? String(sum) : steps.join('  →  ') };
  }

  function renderSections(box, list) {
    box.innerHTML = '';
    list.forEach(function (sec) {
      var d = document.createElement('div'); d.className = 'nc-sec';
      var h = document.createElement('h4'); h.className = 'nc-sec-title'; h.textContent = sec[0];
      var p = document.createElement('p'); p.textContent = sec[1];
      d.appendChild(h); d.appendChild(p); box.appendChild(d);
    });
  }

  function parse(str) {
    var m = str.trim().match(/^(\d{1,2})[.\/\-\s](\d{1,2})[.\/\-\s](\d{4})$/);
    if (!m) return null;
    var d = +m[1], mo = +m[2], y = +m[3];
    var dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    if (y < 1900 || dt > new Date()) return null;
    return { d: d, m: mo, y: y };
  }

  // Автоматически ставит точки при вводе
  input.addEventListener('input', function () {
    var v = input.value.replace(/\D/g, '').slice(0, 8);
    var out = v.slice(0, 2);
    if (v.length > 2) out += '.' + v.slice(2, 4);
    if (v.length > 4) out += '.' + v.slice(4, 8);
    input.value = out;
    err.textContent = '';
    if (v.length === 8) calculate();
  });

  form.addEventListener('submit', function (e) { e.preventDefault(); calculate(); });
  $('nc-btn').addEventListener('click', function () { calculate(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); calculate(); } });

  function calculate() {
    var p = parse(input.value);
    if (!p) {
      err.textContent = 'Проверьте дату: нужен формат ДД.ММ.ГГГГ, например 24.09.1987';
      results.classList.remove('is-visible');
      return;
    }
    err.textContent = '';

    var dd = String(p.d).padStart(2, '0'), mm = String(p.m).padStart(2, '0'), yy = String(p.y);

    var dayDigits = String(p.d).split('').map(Number);
    var c = reduce(dayDigits);
    var allDigits = (dd + mm + yy).split('').map(Number);
    var m = reduce(allDigits);

    var ci = CONSCIOUSNESS[c.value], mi = MISSION[m.value];

    $('nc-c-num').textContent = c.value;
    $('nc-c-name').textContent = ci.name;
    $('nc-c-calc').textContent = p.d <= 9 ? 'День рождения: ' + p.d : c.calc;
    $('nc-c-days').textContent = 'Рождённые ' + ci.days + ' числа';
    $('nc-c-plus').textContent = ci.plus;
    $('nc-c-minus').textContent = ci.minus;

    $('nc-m-num').textContent = m.value;
    $('nc-m-name').textContent = 'Миссия ' + m.value + ': ' + mi.name;
    $('nc-m-calc').textContent = m.calc;
    $('nc-m-text').textContent = mi.text;
    renderSections($('nc-c-sections'), ci.sections);
    renderSections($('nc-m-sections'), mi.sections);

    results.classList.remove('is-visible');
    void results.offsetWidth;
    results.classList.add('is-visible');
  }
})();
